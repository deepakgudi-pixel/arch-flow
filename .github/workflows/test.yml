name: Test

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Playwright Chromium on Linux
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Install Playwright Chromium
        if: runner.os != 'Linux'
        run: npx playwright install chromium
        working-directory: frontend

      - name: Audit backend production dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: backend

      - name: Audit frontend production dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: frontend

      - name: Run backend tests
        run: npm test
        working-directory: backend

      - name: Run frontend lint
        run: npm run lint
        working-directory: frontend

      - name: Run frontend typecheck
        run: npm run typecheck
        working-directory: frontend
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_dummy
          NEXT_PUBLIC_API_URL: http://127.0.0.1:4000/api

      - name: Build frontend
        run: npm run build
        working-directory: frontend
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_dummy
          NEXT_PUBLIC_API_URL: http://127.0.0.1:4000/api

      - name: Run editor smoke test
        run: npm run smoke:editor
        working-directory: frontend
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_dummy
          NEXT_PUBLIC_API_URL: http://127.0.0.1:4000/api

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-${{ matrix.os }}
          path: |
            frontend/test-results
            frontend/playwright-report
          if-no-files-found: ignore
